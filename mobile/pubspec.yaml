name: rental_mobile
description: Caritahub Rental - Car Rental Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  dio: ^5.4.0
  go_router: ^13.0.1
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  image_picker: ^1.0.7
  socket_io_client: ^2.0.3+1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.0.0
  webview_flutter: ^4.5.0
  signature_pad_widget: ^3.0.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  badges: ^3.1.2
  fl_chart: ^0.66.2
  cupertino_icons: ^1.0.6
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
